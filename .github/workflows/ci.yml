name: GlowChat CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend - PHP validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, redis
          coverage: none
          tools: composer

      - name: Validate Composer configuration
        working-directory: backend
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check PHP syntax
        run: |
          find backend \
            -path 'backend/vendor' -prune -o \
            -name '*.php' -type f -print0 |
          xargs -0 -r -n 1 php -l

  android:
    name: Android - Build and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Run Android unit tests and build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
